name: Windows 断网登录页完整场景重复取证
on:
  workflow_dispatch:
  push:
    branches: [actions-test]
    paths:
      - .github/workflows/chinese-cache-reproduction.yml
      - tests/chinese-cache-reproduction.ps1
permissions:
  contents: read
jobs:
  reproduce:
    name: 完整场景-${{ matrix.rep }}
    runs-on: windows-11-arm
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        rep: [1, 2, 3]
    steps:
      - name: 保留原始发布字节
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: 完整运行后再收集数据库诊断
        shell: powershell
        run: .\tests\chinese-cache-reproduction.ps1 -ReportDir "$env:RUNNER_TEMP\reproduction"
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: cache-reproduction-${{ matrix.rep }}
          path: ${{ runner.temp }}/reproduction
          if-no-files-found: error
