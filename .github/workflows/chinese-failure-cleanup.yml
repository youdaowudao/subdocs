name: Windows 中文化失败后的实际窗口清理
on:
  workflow_dispatch:
  push:
    branches: [actions-test]
    paths:
      - .github/workflows/chinese-failure-cleanup.yml
      - tests/chinese-failure-cleanup.ps1
      - docs/public/install/chinese.ps1
permissions:
  contents: read
jobs:
  cleanup:
    runs-on: windows-11-arm
    timeout-minutes: 15
    steps:
      - name: 保留发布文件原始字节
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: 运行未修改的发布命令并验证失败清理
        shell: powershell
        run: .\tests\chinese-failure-cleanup.ps1 -ReportDir "$env:RUNNER_TEMP\failure-cleanup"
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: windows-failure-cleanup
          path: ${{ runner.temp }}/failure-cleanup
          if-no-files-found: error
