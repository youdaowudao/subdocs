# Windows 版 UseGoodAI中转快速接入助手：在 GitHub 的 Windows 机器上测试仓库里要发布的 exe。
# 先跑 Windows 原生的 Go 测试，再实际打开窗口：第一次打开、再次打开、网站导入链接
# 交给已开的窗口、没有窗口时用链接打开、上一稳定版运行时打开新版，窗口都要一直留着。
# 不使用任何密钥或 Secrets，导入链接里只有假密钥。
name: Windows 快速接入助手测试

on:
  workflow_dispatch:
  push:
    paths:
      - usegoodai-codex-installer/quick-connect/**
      - docs/public/download/**
      - .github/workflows/windows-quick-connect.yml

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      # 测试拿仓库里的期望文件逐字节比较，检出时不能改成 Windows 换行。
      - name: 检出时保留原始换行
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-go@v6
        with:
          go-version-file: usegoodai-codex-installer/quick-connect/go.mod
          cache: false

      - name: Go 测试（Windows 原生）
        working-directory: usegoodai-codex-installer/quick-connect
        env:
          QUICK_CONNECT_EXE: ${{ github.workspace }}\docs\public\download\usegoodai-quick-connect-windows-x64.exe
        run: go test -count=1 ./...

      # 用户用 irm | iex 时多数是系统自带的 Windows PowerShell 5.1，上一步只用了 pwsh 7。
      - name: 写入 config.toml 与 Windows PowerShell 5.1 一致
        working-directory: usegoodai-codex-installer/quick-connect
        env:
          PWSH: powershell.exe
        run: go test -count=1 -v -run 'TestPowerShellInstallerConfigMatchesHelper' ./connect/

      - name: 实际打开助手
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          $version = (Select-String -Path usegoodai-codex-installer/quick-connect/connect/product.go -Pattern 'Version\s+=\s+"([^"]+)"').Matches[0].Groups[1].Value
          ./usegoodai-codex-installer/quick-connect/tools/windows_smoke.ps1 `
            -New docs/public/download/usegoodai-quick-connect-windows-x64.exe `
            -Previous docs/public/download/previous/usegoodai-quick-connect-windows-x64.exe `
            -Version $version

      - name: 保存截图
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: windows-smoke-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/helper-smoke/*.png
          if-no-files-found: ignore
          retention-days: 14

      - name: 实际点击生图升级按钮（旧 Key 与缺 Key）
        shell: pwsh
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File usegoodai-codex-installer/quick-connect/tools/windows_image_upgrade.ps1 -Exe docs/public/download/usegoodai-quick-connect-windows-x64.exe

      - name: 保存生图升级窗口记录
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: image-upgrade-window-${{ matrix.os }}
          path: ${{ runner.temp }}/image-upgrade-window/*.*
          if-no-files-found: ignore
          retention-days: 30
