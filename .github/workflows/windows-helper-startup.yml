name: Windows 助手启动候选测试

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/windows-helper-startup.yml
      - usegoodai-codex-installer/quick-connect/startlog*.go
      - usegoodai-codex-installer/quick-connect/error_dialog_windows.go
      - usegoodai-codex-installer/quick-connect/tools/windows_error_dialog.ps1

permissions:
  contents: read

jobs:
  startup:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: usegoodai-codex-installer/quick-connect/go.mod
          cache: false
      - name: 构建本次源码的候选 EXE
        shell: pwsh
        run: |
          python usegoodai-codex-installer/quick-connect/build.py "$env:RUNNER_TEMP/candidate/helper.exe"
      - name: 原生日志与启动参数回归
        working-directory: usegoodai-codex-installer/quick-connect
        shell: pwsh
        run: go test -count=1 -run 'TestStartLog|TestSoftwareWebview|TestNativeTerminalDetection' .
      - name: 实际窗口、再次打开、链接唤起和旧版接管
        shell: pwsh
        run: |
          $env:CODEX_HOME = "$env:RUNNER_TEMP/启动 中文路径/codex"
          $env:LOCALAPPDATA = "$env:RUNNER_TEMP/启动 中文路径/local"
          $env:APPDATA = "$env:RUNNER_TEMP/启动 中文路径/roaming"
          $version = (Select-String -Path usegoodai-codex-installer/quick-connect/connect/product.go -Pattern 'Version\s+=\s+"([^"]+)"').Matches[0].Groups[1].Value
          ./usegoodai-codex-installer/quick-connect/tools/windows_smoke.ps1 `
            -New "$env:RUNNER_TEMP/candidate/helper.exe" `
            -Previous docs/public/download/usegoodai-quick-connect-windows-x64.exe `
            -Version $version
          if (Test-Path "$env:LOCALAPPDATA/UseGoodAI/QuickConnect/logs/latest-error.log") { throw '正常启动产生了错误日志' }
      - name: 核对实际渲染参数、正常关闭与无错误日志
        shell: pwsh
        run: |
          $env:CODEX_HOME = "$env:RUNNER_TEMP/启动 中文路径/codex"
          $env:LOCALAPPDATA = "$env:RUNNER_TEMP/启动 中文路径/local"
          $env:APPDATA = "$env:RUNNER_TEMP/启动 中文路径/roaming"
          foreach ($mode in @('software', 'system')) {
            $helper = $null
            try {
              if ($mode -eq 'system') {
                $helper = Start-Process "$env:RUNNER_TEMP/candidate/helper.exe" -ArgumentList '--system-gpu' -PassThru
              } else {
                $helper = Start-Process "$env:RUNNER_TEMP/candidate/helper.exe" -PassThru
              }
              $deadline = (Get-Date).AddSeconds(45)
              do {
                Start-Sleep -Milliseconds 300
                $helper.Refresh()
                if ($helper.HasExited) { throw "$mode 提前退出：$($helper.ExitCode)" }
              } until (($helper.MainWindowHandle -ne 0 -and $helper.MainWindowTitle -eq 'UseGoodAI中转快速接入助手') -or (Get-Date) -gt $deadline)
              if ($helper.MainWindowHandle -eq 0) { throw "$mode 未出现窗口" }
              Start-Sleep -Seconds 2
              $profile = [IO.Path]::GetFullPath("$env:LOCALAPPDATA/UseGoodAI/QuickConnect/webview-compat-v1")
              $browser = @(Get-CimInstance Win32_Process -Filter "Name='msedgewebview2.exe'" | Where-Object {
                $_.CommandLine -and $_.CommandLine.IndexOf($profile, [StringComparison]::OrdinalIgnoreCase) -ge 0 -and $_.CommandLine -notmatch '--type='
              })
              if ($browser.Count -ne 1) { throw "$mode 无法唯一定位本次 WebView2，匹配数 $($browser.Count)" }
              $disabled = $browser[0].CommandLine -match '--disable-gpu(?:\s|$)'
              if ($disabled -ne ($mode -eq 'software')) { throw "$mode 实际硬件加速参数不符" }
              if (-not $helper.CloseMainWindow() -or -not $helper.WaitForExit(15000)) { throw "$mode 未正常关闭" }
              if ($helper.ExitCode -ne 0) { throw "$mode 关闭退出码异常：$($helper.ExitCode)" }
              if (Test-Path "$env:LOCALAPPDATA/UseGoodAI/QuickConnect/logs/latest-error.log") { throw "$mode 正常启动产生错误日志" }
              Write-Host "${mode}: 实际渲染参数、正常关闭和无错误日志通过"
            } finally {
              if ($helper -and -not $helper.HasExited) { Stop-Process -Id $helper.Id -Force }
            }
            Start-Sleep -Seconds 2
          }
      - name: 实际操作原生错误弹窗的复制与打开日志按钮
        working-directory: usegoodai-codex-installer/quick-connect
        shell: pwsh
        run: |
          go test -c -o "$env:RUNNER_TEMP/error-ui-test.exe" .
          powershell.exe -NoProfile -STA -ExecutionPolicy Bypass -File tools/windows_error_dialog.ps1 -TestExe "$env:RUNNER_TEMP/error-ui-test.exe"
      - name: 保留候选、日志、截图与系统信息
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force "$env:RUNNER_TEMP/startup-evidence" | Out-Null
          Get-CimInstance Win32_OperatingSystem | Select-Object Caption, Version, OSArchitecture | ConvertTo-Json | Set-Content "$env:RUNNER_TEMP/startup-evidence/os.json"
          Get-CimInstance Win32_VideoController | Select-Object Name, DriverVersion | ConvertTo-Json | Set-Content "$env:RUNNER_TEMP/startup-evidence/gpu.json"
          Get-FileHash "$env:RUNNER_TEMP/candidate/helper.exe" | Select-Object Algorithm, Hash | ConvertTo-Json | Set-Content "$env:RUNNER_TEMP/startup-evidence/candidate-hash.json"
          Copy-Item "$env:RUNNER_TEMP/启动 中文路径/local/UseGoodAI/QuickConnect/logs/*.log" "$env:RUNNER_TEMP/startup-evidence/" -ErrorAction SilentlyContinue
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: helper-startup-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/candidate/helper.exe
            ${{ runner.temp }}/startup-evidence/*
            ${{ runner.temp }}/helper-smoke/*.png
            ${{ runner.temp }}/error-ui/report/*
          retention-days: 30
