name: Mac 中文化实机验证
on:
  workflow_dispatch:
  push:
    branches: [actions-test]
    paths:
      - .github/workflows/chinese-macos.yml
      - tests/chinese-macos-*
      - tests/chinese-onboarding.js
      - docs/public/install/chinese.sh
permissions:
  contents: read
jobs:
  desktop:
    name: ${{ matrix.network }}-${{ matrix.auth }}-${{ matrix.variant }}
    runs-on: macos-15
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        network: [refused, blackhole, online]
        auth: [apikey, login]
        variant: [candidate]
        include:
          - network: blackhole
            auth: login
            variant: old
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: 核对单文件与两份发布副本
        run: python3 usegoodai-codex-installer/codex-zh/macos/build.py --check
      - name: 读取固定旧版对照对象
        if: matrix.variant == 'old'
        run: git fetch --no-tags origin 5e228f0224d5a515524055736abd7625ea628460
      - name: 原始发布命令、正常重开与连续执行
        env:
          NETWORK: ${{ matrix.network }}
          AUTH: ${{ matrix.auth }}
          VARIANT: ${{ matrix.variant }}
        run: |
          if [ "$VARIANT" = old ]; then
            python3 tests/chinese-macos-desktop.py --network "$NETWORK" --auth "$AUTH" --old
          else
            python3 tests/chinese-macos-desktop.py --network "$NETWORK" --auth "$AUTH"
          fi
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: mac-${{ matrix.network }}-${{ matrix.auth }}-${{ matrix.variant }}
          path: ${{ runner.temp }}/chinese-macos/report
          if-no-files-found: error
          retention-days: 21
  transport:
    name: Mac 连接超时与页面切换
    runs-on: macos-15
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python3 tests/chinese-macos-cdp.py
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: mac-cdp
          path: ${{ runner.temp }}/mac-cdp
