name: Mac 中文化实机验证
on:
  workflow_dispatch:
  push:
    branches: [actions-test]
    paths:
      - .github/workflows/chinese-macos.yml
      - tests/chinese-macos-*
      - tests/chinese-onboarding.js
      - docs/public/install/chinese.sh
permissions:
  contents: read
jobs:
  desktop:
    name: ${{ matrix.network }}-${{ matrix.auth }}-${{ matrix.variant }}
    runs-on: macos-15
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        network: [refused, blackhole, online]
        auth: [apikey, login]
        variant: [candidate]
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: 核对单文件与两份发布副本
        run: python3 usegoodai-codex-installer/codex-zh/macos/build.py --check
      - name: 原始发布命令、正常重开与连续执行
        env:
          NETWORK: ${{ matrix.network }}
          AUTH: ${{ matrix.auth }}
        run: python3 tests/chinese-macos-desktop.py --network "$NETWORK" --auth "$AUTH"
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: mac-${{ matrix.network }}-${{ matrix.auth }}-${{ matrix.variant }}
          path: ${{ runner.temp }}/chinese-macos/report
          if-no-files-found: error
          retention-days: 21
