name: 工具发布门禁

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'usegoodai-codex-installer/**'
      - 'docs/public/install/**'
      - 'docs/public/download/**'
      - 'docs/public/_headers'
      - '.github/workflows/**'
      - 'scripts/require-release-checks.mjs'
      - 'tests/release-gate.test.mjs'
      - 'tests/install-*.test.mjs'
      - 'tests/quick-connect-download.test.mjs'
      - 'tests/image-tool-release.test.mjs'
      - '!**/*.md'
      - '!**/*.txt'
      - '!**/*.png'
      - '!**/*.jpg'
      - '!**/*.jpeg'
      - '!**/*.svg'
      - '!**/*.gif'
      - '!**/*.webp'
      - '!**/*.ico'
      - '!**/*.avif'
  push:
    branches: [main, actions-test]
    paths:
      - 'usegoodai-codex-installer/**'
      - 'docs/public/install/**'
      - 'docs/public/download/**'
      - 'docs/public/_headers'
      - '.github/workflows/**'
      - 'scripts/require-release-checks.mjs'
      - 'tests/release-gate.test.mjs'
      - 'tests/install-*.test.mjs'
      - 'tests/quick-connect-download.test.mjs'
      - 'tests/image-tool-release.test.mjs'
      - '!**/*.md'
      - '!**/*.txt'
      - '!**/*.png'
      - '!**/*.jpg'
      - '!**/*.jpeg'
      - '!**/*.svg'
      - '!**/*.gif'
      - '!**/*.webp'
      - '!**/*.ico'
      - '!**/*.avif'

permissions:
  contents: read

concurrency:
  group: tools-release-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  mac-models:
    name: Mac 国产模型导入门禁
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: 官方 App、系统 Shell、JXA 与交付成品完整导入
        run: python3 usegoodai-codex-installer/codex-domestic-models/tests/macos_install_test.py
      - name: 保留验收记录
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: mac-model-import-gate
          path: ${{ runner.temp }}/mac-model-import-gate/report
          if-no-files-found: error
          retention-days: 14

  models-regression:
    name: 国产模型导入回归
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 获取与模型快照一致的官方 Codex
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/codex-test-backend"
          curl -fSL --retry 2 https://github.com/openai/codex/releases/download/rust-v0.170.0/codex-x86_64-unknown-linux-musl.tar.gz -o "$RUNNER_TEMP/codex-test-backend/codex.tar.gz"
          tar -xzf "$RUNNER_TEMP/codex-test-backend/codex.tar.gz" -C "$RUNNER_TEMP/codex-test-backend"
          echo "TEST_CODEX=$RUNNER_TEMP/codex-test-backend/codex-x86_64-unknown-linux-musl" >> "$GITHUB_ENV"
          echo "TEST_NODE=$(command -v node)" >> "$GITHUB_ENV"
          echo "TEST_PWSH=$(command -v pwsh)" >> "$GITHUB_ENV"
      - name: Linux、PowerShell、备份恢复、重复导入与卸载
        run: python3 usegoodai-codex-installer/codex-domestic-models/tests/test_models.py
      - name: 旧版 Codex 模型选择器
        shell: bash
        run: |
          for version in 0.162.1 0.165.0; do
            dir="$RUNNER_TEMP/codex-$version"
            mkdir -p "$dir"
            curl -fSL --retry 2 "https://github.com/openai/codex/releases/download/rust-v$version/codex-x86_64-unknown-linux-musl.tar.gz" | tar -xz -C "$dir"
          done
          mkdir -p "$RUNNER_TEMP/previous-models"
          for ext in sh ps1; do
            curl -fSL --retry 2 "https://raw.githubusercontent.com/youdaowudao/subdocs/b75b86296102cf6930c3900fe0c1154778e5c4a6/usegoodai-codex-installer/codex-domestic-models/install/codex-models.$ext" -o "$RUNNER_TEMP/previous-models/codex-models.$ext"
          done
          python3 usegoodai-codex-installer/codex-domestic-models/tests/test_legacy_picker.py \
            --codex "$RUNNER_TEMP/codex-0.162.1/codex-x86_64-unknown-linux-musl" \
            --codex "$RUNNER_TEMP/codex-0.165.0/codex-x86_64-unknown-linux-musl" \
            --old-script "$RUNNER_TEMP/previous-models/codex-models.sh" \
            --old-script "$RUNNER_TEMP/previous-models/codex-models.ps1"

  published-files:
    name: 发布文件检查
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: 安装站点构建依赖
        run: npm ci
      - name: 核对脚本、响应头和压缩包实际内容
        run: node --test tests/install-codex-models.test.mjs tests/install-codex-config.test.mjs tests/install-claude.test.mjs tests/install-headers.test.mjs tests/quick-connect-download.test.mjs tests/release-gate.test.mjs
      - name: 构建文档站
        run: npm run docs:build
