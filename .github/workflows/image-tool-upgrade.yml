name: 生图工具原生升级测试

on:
  workflow_dispatch:
  push:
    paths:
      - docs/public/install/usegoodai-imagines-tool/**
      - tests/image-upgrade-native.py
      - tests/image-upgrade-ui.test.mjs
      - .github/workflows/image-tool-upgrade.yml

permissions:
  contents: read

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2025, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - name: 保留发布文件原始字节
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: 运行真实原生安装入口和升级程序
        shell: ${{ startsWith(matrix.os, 'windows') && 'powershell' || 'bash' }}
        run: python tests/image-upgrade-native.py
      - name: 检查升级按钮和旧版本显示
        run: node --test tests/image-upgrade-ui.test.mjs
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: image-upgrade-${{ matrix.os }}
          path: test-results/image-upgrade-native.json
          if-no-files-found: ignore
          retention-days: 30
