name: Windows 中文化主界面入口核对
on:
  workflow_dispatch:
  push:
    branches: [actions-test]
    paths:
      - .github/workflows/chinese-main-window.yml
      - tests/chinese-main-window.ps1
permissions:
  contents: read
jobs:
  main-window:
    runs-on: windows-11-arm
    timeout-minutes: 15
    steps:
      - name: 保留原始发布字节
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: 进入首次引导后的实际界面
        shell: powershell
        run: .\tests\chinese-main-window.ps1 -ReportDir "$env:RUNNER_TEMP\main-window"
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: windows-main-window
          path: ${{ runner.temp }}/main-window
          if-no-files-found: error
