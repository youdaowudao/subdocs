# Mac 版 UseGoodAI中转快速接入助手：在 GitHub 的 Apple 芯片 macOS 机器上测试并打包。
# 接收 usegoodai:// 导入链接要用 Apple 的系统接口（Cocoa），Linux 上编译不了。
# 手动触发，或推送助手的 Mac 相关文件时自动运行；不使用任何密钥或 Secrets，测试只用临时生成的假密钥，不打印。
name: Mac 快速接入助手打包

on:
  workflow_dispatch:
  push:
    paths:
      - usegoodai-codex-installer/quick-connect/macapp/**
      - usegoodai-codex-installer/quick-connect/connect/**
      - usegoodai-codex-installer/install/codex.sh
      - usegoodai-codex-installer/desktop/**
      - .github/workflows/mac-quick-connect.yml

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    defaults:
      run:
        working-directory: usegoodai-codex-installer
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-go@v6
        with:
          go-version-file: usegoodai-codex-installer/quick-connect/go.mod
          cache: false

      - name: 确认是 Apple 芯片
        run: |
          uname -m
          test "$(uname -m)" = arm64

      - name: 测试链接解析和密钥传入
        working-directory: usegoodai-codex-installer/quick-connect
        run: go test -count=1 -v ./connect/ ./macapp/

      - name: 用 Mac 系统 Bash 测试安装脚本
        env:
          INSTALLER_TEST_BASH: /bin/bash
        run: |
          /bin/bash tests/installers.sh
          INSTALLER_TEST_LOCALE=en_US.ISO8859-1 /bin/bash tests/installers.sh

      - name: 打包
        run: python3 desktop/build.py --mac-only

      - name: 检查成品
        env:
          USEGOODAI_MAC_ONLY: "1"
        working-directory: usegoodai-codex-installer/desktop
        run: python3 test_packaging.py -v -k test_assistant_mac_artifacts -k test_only_the_assistant_runner -k test_zip_application

      - name: 在本机打开导入链接
        run: |
          mkdir -p "$RUNNER_TEMP/smoke"
          ditto -x -k dist/desktop/download/usegoodai-quick-connect-mac-arm64.zip "$RUNNER_TEMP/smoke"
          bash quick-connect/macapp/smoke_test.sh "$RUNNER_TEMP/smoke/UseGoodAI中转快速接入助手.app"

      - uses: actions/upload-artifact@v5
        with:
          name: usegoodai-quick-connect-mac-arm64
          path: usegoodai-codex-installer/dist/desktop/download/usegoodai-quick-connect-mac-arm64.zip
          if-no-files-found: error
          retention-days: 30
