name: Windows 中文化按钮集成验收
on:
  workflow_dispatch:
    inputs:
      system:
        description: 只补测尚未通过的系统
        type: choice
        default: both
        options: [both, windows10, windows11]
      mode:
        description: 功能完整验收或仅补显示变更
        type: choice
        default: full
        options: [full, layout]
permissions:
  contents: read
jobs:
  windows10:
    name: Windows 10 x64 桌面实际点击中文化
    if: inputs.system == 'both' || inputs.system == 'windows10'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: 官方Windows10系统交互式桌面验收
        run: python3 usegoodai-codex-installer/quick-connect/tools/windows10_chinese_vm.py ${{ inputs.mode == 'layout' && '--layout-only' || '' }}
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: chinese-ui-windows10
          path: ${{ runner.temp }}/chinese-win10/shared/report
          if-no-files-found: error
  windows11:
    name: Windows 11 x64 桌面实际点击中文化
    if: inputs.system == 'both' || inputs.system == 'windows11'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: 官方Windows11系统交互式桌面验收
        run: python3 usegoodai-codex-installer/quick-connect/tools/windows10_chinese_vm.py --version 11 ${{ inputs.mode == 'layout' && '--layout-only' || '' }}
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: chinese-ui-windows11-x64
          path: ${{ runner.temp }}/chinese-win11/shared/report
          if-no-files-found: error
