name: Windows 中文化按钮集成验收
on:
  workflow_dispatch:
  push:
    branches: [actions-test]
    paths:
      - .github/workflows/chinese-ui-windows.yml
      - usegoodai-codex-installer/quick-connect/chinesetool/**
      - usegoodai-codex-installer/quick-connect/connect/chinese*
      - usegoodai-codex-installer/quick-connect/tools/windows_chinese_ui.ps1
      - usegoodai-codex-installer/quick-connect/tools/windows10_chinese_vm.py
      - usegoodai-codex-installer/quick-connect/tools/win10-oem/**
      - docs/public/download/usegoodai-quick-connect-windows-x64.exe
permissions:
  contents: read
jobs:
  windows11:
    name: Windows 11 ARM 实际点击中文化
    runs-on: windows-11-arm
    timeout-minutes: 25
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: 候选EXE、可见PowerShell与自动关闭
        shell: powershell
        run: ./usegoodai-codex-installer/quick-connect/tools/windows_chinese_ui.ps1 -Exe docs/public/download/usegoodai-quick-connect-windows-x64.exe -ReportDir "$env:RUNNER_TEMP/chinese-ui" -WindowsVersion 11
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: chinese-ui-windows11
          path: ${{ runner.temp }}/chinese-ui
          if-no-files-found: error
  windows10:
    name: Windows 10 x64 桌面实际点击中文化
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: 官方Windows10评估系统交互式桌面验收
        run: python3 usegoodai-codex-installer/quick-connect/tools/windows10_chinese_vm.py
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: chinese-ui-windows10
          path: ${{ runner.temp }}/chinese-win10/shared/report
          if-no-files-found: error
