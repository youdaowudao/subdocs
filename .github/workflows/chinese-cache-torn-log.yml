name: Windows 中文化数据库中断对照
on:
  workflow_dispatch:
  push:
    branches: [actions-test]
    paths:
      - .github/workflows/chinese-cache-torn-log.yml
      - docs/public/install/chinese.ps1
permissions:
  contents: read
jobs:
  torn-log:
    runs-on: windows-11-arm
    timeout-minutes: 18
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - shell: powershell
        run: .\tests\chinese-cache-probe.ps1 -Network block -WalFault torn-tail -ReportDir "$env:RUNNER_TEMP\torn-log"
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: chinese-torn-log
          path: ${{ runner.temp }}/torn-log
          if-no-files-found: error
          retention-days: 21
