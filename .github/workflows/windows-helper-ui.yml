name: Windows 助手界面消失排查
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/windows-helper-ui.yml
      - tests/windows-helper-crash/window_trace.ps1
      - usegoodai-codex-installer/quick-connect/tools/css_compare.py
permissions:
  contents: read
concurrency:
  group: helper-ui-${{ github.ref }}
  cancel-in-progress: true
jobs:
  cleanup:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - name: 释放本排查分支重复运行占用的 Windows 机器
        env:
          GH_TOKEN: ${{ github.token }}
          TASK_BRANCH: ${{ github.ref_name }}
          TASK_RUN: ${{ github.run_id }}
          TASK_REPOSITORY: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import json, os, subprocess
          branch = os.environ['TASK_BRANCH']
          if not branch.startswith('investigate-helper-ui-'):
              raise SystemExit(0)
          repo = os.environ['TASK_REPOSITORY']
          current = int(os.environ['TASK_RUN'])
          # Keep the already running narrow-viewport comparison as evidence.
          keep = {current, 42389200249}
          names = {'Windows 接入助手闪退排查', 'Windows 快速接入助手测试', 'Windows 助手界面消失排查'}
          data = json.loads(subprocess.check_output(['gh', 'api', '--method', 'GET',
              f'repos/{repo}/actions/runs', '-f', f'branch={branch}', '-f', 'per_page=100']))
          for run in data['workflow_runs']:
              if (run['id'] not in keep and run['head_branch'] == branch and run['name'] in names
                      and run['status'] in {'queued', 'in_progress'}):
                  print(f"Cancel superseded task run {run['id']}: {run['name']}", flush=True)
                  subprocess.run(['gh', 'api', '--method', 'POST',
                      f"repos/{repo}/actions/runs/{run['id']}/cancel"], check=False)
          PY
  trace:
    needs: cleanup
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, windows-11-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      # The hosted ARM image can stay on its first-login privacy desktop.
      # Without dismissing it, window existence checks give false confidence:
      # https://github.com/actions/runner-images/issues/14069
      - name: 关闭测试虚拟机的首次登录隐私页面
        if: matrix.os == 'windows-11-arm'
        shell: powershell
        run: |
          $policy = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\OOBE'
          New-Item -Path $policy -Force | Out-Null
          New-ItemProperty -Path $policy -Name DisablePrivacyExperience -PropertyType DWord -Value 1 -Force | Out-Null
          Get-Process -Name CloudExperienceHostBroker, UserOOBEBroker -ErrorAction SilentlyContinue |
            Stop-Process -Force -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 3
          if (-not (Get-Process -Name explorer -ErrorAction SilentlyContinue)) {
            Start-Process explorer.exe
            Start-Sleep -Seconds 3
          }
          # Also finish an already running privacy flow. Policy alone does
          # not dismiss it on all hosted ARM images (runner-images#14069).
          Add-Type -AssemblyName System.Windows.Forms
          [System.Windows.Forms.SendKeys]::SendWait('{ENTER}')
          Start-Sleep -Seconds 3
          [System.Windows.Forms.SendKeys]::SendWait('{ENTER}')
          Start-Sleep -Seconds 3
          [System.Windows.Forms.SendKeys]::SendWait('{ESC}')
          Start-Sleep -Seconds 2
          Get-Process -Name explorer, winlogon, WWAHost, CloudExperienceHostBroker, UserOOBEBroker -ErrorAction SilentlyContinue |
            Select-Object Id, ProcessName, SessionId, MainWindowTitle
          query session
          Get-Process | Where-Object MainWindowTitle | Select-Object Id, ProcessName, MainWindowTitle
      - name: 取出三版原始成品
        shell: pwsh
        run: |
          $folder = Join-Path $env:RUNNER_TEMP 'ui-builds'
          New-Item -ItemType Directory -Force -Path $folder | Out-Null
          foreach ($entry in @(
            @('1105','5267829:docs/public/download/usegoodai-quick-connect-windows-x64.exe'),
            @('1107-1605','053b218:docs/public/download/usegoodai-quick-connect-windows-x64.exe'),
            @('1.1.4','b1fa505:docs/public/download/usegoodai-quick-connect-windows-x64.exe'),
            @('candidate','85cb9d2:tests/windows-helper-crash/builds/helper-candidate.exe')
          )) {
            $path = Join-Path $folder "helper-$($entry[0]).exe"
            cmd /c "git show $($entry[1]) > `"$path`""
            if ($LASTEXITCODE -ne 0) { throw "Cannot extract $($entry[0])" }
            Get-FileHash -LiteralPath $path
          }
      - name: 记录实际协议唤起、最小化还原和连续唤起后的窗口
        shell: powershell
        run: ./tests/windows-helper-crash/window_trace.ps1 -Folder "$env:RUNNER_TEMP\ui-builds"
      - name: 保存窗口轨迹与截图
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: helper-ui-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/helper-window-trace/*.png
            ${{ runner.temp }}/helper-window-trace/*.json
            ${{ runner.temp }}/helper-window-trace/*.txt
            ${{ runner.temp }}/helper-window-trace/*.log
          retention-days: 14
  css:
    needs: cleanup
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, windows-11-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: usegoodai-codex-installer/quick-connect/go.mod
          cache: false
      - name: 关闭测试虚拟机的首次登录隐私页面
        if: matrix.os == 'windows-11-arm'
        shell: powershell
        run: |
          $policy = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\OOBE'
          New-Item -Path $policy -Force | Out-Null
          New-ItemProperty -Path $policy -Name DisablePrivacyExperience -PropertyType DWord -Value 1 -Force | Out-Null
          Get-Process -Name CloudExperienceHostBroker, UserOOBEBroker -ErrorAction SilentlyContinue |
            Stop-Process -Force -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 3
          if (-not (Get-Process -Name explorer -ErrorAction SilentlyContinue)) {
            Start-Process explorer.exe
            Start-Sleep -Seconds 3
          }
          Add-Type -AssemblyName System.Windows.Forms
          [System.Windows.Forms.SendKeys]::SendWait('{ENTER}')
          Start-Sleep -Seconds 3
          [System.Windows.Forms.SendKeys]::SendWait('{ENTER}')
          Start-Sleep -Seconds 3
          [System.Windows.Forms.SendKeys]::SendWait('{ESC}')
          Start-Sleep -Seconds 2
          Get-Process -Name explorer, winlogon, WWAHost, CloudExperienceHostBroker, UserOOBEBroker -ErrorAction SilentlyContinue |
            Select-Object Id, ProcessName, SessionId, MainWindowTitle
          query session
      - name: 只替换 CSS 构建两版内部测试程序
        shell: pwsh
        run: python usegoodai-codex-installer/quick-connect/tools/css_compare.py
      - name: 同机比较旧 CSS 和新 CSS 的窗口轨迹
        shell: powershell
        run: ./tests/windows-helper-crash/window_trace.ps1 -Folder usegoodai-codex-installer/quick-connect/.work/css-compare/builds -WorkName helper-css-trace -ExerciseLayout
      - name: 保存 CSS 对照证据
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: helper-css-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/helper-css-trace/*.png
            ${{ runner.temp }}/helper-css-trace/*.json
            ${{ runner.temp }}/helper-css-trace/*.txt
            ${{ runner.temp }}/helper-css-trace/*.log
            usegoodai-codex-installer/quick-connect/.work/css-compare/metadata.json
          retention-days: 14
