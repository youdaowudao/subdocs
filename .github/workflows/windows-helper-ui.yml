name: Windows 助手界面消失排查
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/windows-helper-ui.yml
permissions:
  contents: read
concurrency:
  group: helper-ui-${{ github.ref }}
  cancel-in-progress: true
jobs:
  stop:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      actions: write
      contents: read
    steps:
      - name: 按用户要求停止本次排查的全部测试
        env:
          GH_TOKEN: ${{ github.token }}
          TASK_BRANCH: ${{ github.ref_name }}
          TASK_RUN: ${{ github.run_id }}
          TASK_REPOSITORY: ${{ github.repository }}
        run: |
          python3 - <<'PYTHON'
          import json, os, subprocess
          branch = os.environ['TASK_BRANCH']
          if not branch.startswith('investigate-helper-ui-'):
              raise SystemExit(0)
          repo = os.environ['TASK_REPOSITORY']
          current = int(os.environ['TASK_RUN'])
          names = {'Windows 接入助手闪退排查', 'Windows 快速接入助手测试', 'Windows 助手界面消失排查'}
          data = json.loads(subprocess.check_output(['gh', 'api', '--method', 'GET',
              f'repos/{repo}/actions/runs', '-f', f'branch={branch}', '-f', 'per_page=100']))
          for run in data['workflow_runs']:
              if (run['id'] != current and run['head_branch'] == branch and run['name'] in names
                      and run['status'] in {'queued', 'pending', 'waiting', 'in_progress'}):
                  print(f"Stopping task run {run['id']}: {run['name']}", flush=True)
                  action = 'force-cancel' if run['status'] == 'in_progress' else 'cancel'
                  result = subprocess.run(['gh', 'api', '--method', 'POST',
                      f"repos/{repo}/actions/runs/{run['id']}/{action}"])
                  if result.returncode:
                      subprocess.run(['gh', 'api', '--method', 'POST',
                          f"repos/{repo}/actions/runs/{run['id']}/cancel"], check=False)
          PYTHON
