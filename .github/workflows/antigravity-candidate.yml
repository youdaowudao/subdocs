name: Antigravity App 三平台候选实测
on:
  workflow_dispatch:
  push:
    branches: [actions-test]
    paths:
      - 'usegoodai-codex-installer/quick-connect/**'
      - 'usegoodai-codex-installer/desktop/**'
      - 'usegoodai-codex-installer/install/antigravity.sh'
      - 'usegoodai-codex-installer/tests/antigravity-shell-input.py'
      - 'docs/public/install/antigravity.sh'
      - '.github/workflows/antigravity-candidate.yml'
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: usegoodai-codex-installer/quick-connect
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: usegoodai-codex-installer/quick-connect/go.mod
          cache: false
      - name: Linux 原生回归与 Shell 命令语法
        run: |
          go test -count=1 ./connect ./macapp
          bash -n ../install/antigravity.sh
          python3 ../tests/antigravity-shell-input.py
          node --test ../../tests/image-upgrade-ui.test.mjs
          mkdir -p "$RUNNER_TEMP/agy-evidence"
      - name: 安装并打开官方 Linux App
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y xvfb xdotool openbox imagemagick
          mkdir "$RUNNER_TEMP/agy"
          curl -fL --retry 3 -o "$RUNNER_TEMP/agy.tar.gz" https://storage.googleapis.com/antigravity-public/antigravity-hub/2.35.2-4585983447007232/linux-x64/Antigravity.tar.gz
          sha256sum "$RUNNER_TEMP/agy.tar.gz" | tee "$RUNNER_TEMP/agy-evidence/official-package.sha256"
          tar -xzf "$RUNNER_TEMP/agy.tar.gz" -C "$RUNNER_TEMP/agy"
          # Ubuntu 24.04 requires the official Chromium setuid sandbox helper. Keep sandbox enabled.
          sudo chown root:root "$RUNNER_TEMP/agy/Antigravity-x64/chrome-sandbox"
          sudo chmod 4755 "$RUNNER_TEMP/agy/Antigravity-x64/chrome-sandbox"
          export AGY_TEST_APP="$RUNNER_TEMP/agy/Antigravity-x64/antigravity"
          export AGY_TEST_EVIDENCE="$RUNNER_TEMP/agy-evidence"
          export AGY_TEST_INTERACT="$PWD/tools/antigravity_ui_linux.sh"
          export AGY_TEST_SCRIPT="$PWD/../install/antigravity.sh"
          xvfb-run -a -s '-screen 0 1440x960x24' bash -c 'openbox >/dev/null 2>&1 & wm=$!; trap "kill $wm 2>/dev/null || true" EXIT; go test -count=1 -timeout=5m -run "^TestAntigravityDesktop$" -v ./connect'
      - name: 官方 Linux CLI 1.5.18 配置与原生对话
        run: |
          mkdir "$RUNNER_TEMP/agy-cli"
          curl -fL --retry 3 -o "$RUNNER_TEMP/agy-cli/official.tar.gz" https://storage.googleapis.com/antigravity-public/antigravity-cli/1.5.18-6386224290725888/linux-x64/cli_linux_x64.tar.gz
          printf '%s  %s\n' ef379ec869719112f696e8c7cfddf776618712e58fc38e53df80801d6528abb4677782c7c8778f9c09c9123fa44c2c32675d228c06f2a8f7a8f4214e75f5bb26 "$RUNNER_TEMP/agy-cli/official.tar.gz" | sha512sum -c - | tee "$RUNNER_TEMP/agy-evidence/official-cli.sha512"
          tar -xzf "$RUNNER_TEMP/agy-cli/official.tar.gz" -C "$RUNNER_TEMP/agy-cli" antigravity
          chmod +x "$RUNNER_TEMP/agy-cli/antigravity"
          export AGY_TEST_CLI="$RUNNER_TEMP/agy-cli/antigravity" AGY_TEST_EVIDENCE="$RUNNER_TEMP/agy-evidence" AGY_TEST_SCRIPT="$PWD/../install/antigravity.sh"
          "$AGY_TEST_CLI" --version | tee "$AGY_TEST_EVIDENCE/cli-version.txt"
          go test -count=1 -timeout=3m -run '^TestAntigravityCLI$' -v ./connect
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: Antigravity-Linux-实测记录
          path: ${{ runner.temp }}/agy-evidence
          if-no-files-found: ignore
  windows:
    runs-on: windows-11-arm
    timeout-minutes: 35
    defaults:
      run:
        working-directory: usegoodai-codex-installer/quick-connect
    env:
      GOARCH: amd64
    steps:
      - run: git config --global core.autocrlf false
        working-directory: .
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: usegoodai-codex-installer/quick-connect/go.mod
          cache: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: 候选 EXE 与原生回归
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force "$env:RUNNER_TEMP/candidate","$env:RUNNER_TEMP/agy-evidence" | Out-Null
          python -X utf8 build.py "$env:RUNNER_TEMP/candidate/1.UseGoodAI中转快速接入助手.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item tools/antigravity-windows-readme.txt "$env:RUNNER_TEMP/candidate/使用说明.txt"
      - uses: actions/upload-artifact@v5
        with:
          name: Antigravity-Windows-x64-候选
          path: |
            ${{ runner.temp }}/candidate/*.exe
            ${{ runner.temp }}/candidate/使用说明.txt
          retention-days: 30
      - name: Windows 原生回归与候选资源检查
        shell: pwsh
        run: |
          # Same native package reference as the existing Windows workflow,
          # avoiding the x64-emulated PowerShell startup timeout.
          $families = @(@('Claude','AnthropicPBC.Claude') | ForEach-Object { Get-AppxPackage -Name $_ } | Select-Object -ExpandProperty PackageFamilyName -Unique)
          $env:CLAUDE_TEST_REGISTERED_FAMILIES = if ($families.Count) { $families -join ' ' } else { 'none' }
          $env:QUICK_CONNECT_EXE="$env:RUNNER_TEMP/candidate/1.UseGoodAI中转快速接入助手.exe"
          go test -count=1 -timeout=5m ./connect ./tools/resources
          exit $LASTEXITCODE
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: 官方 Windows x64 CLI 1.5.18 配置与原生对话
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ((Get-CimInstance Win32_OperatingSystem).ProductType -ne 1) { throw 'Windows Server is prohibited' }
          $cli = Join-Path $env:LOCALAPPDATA 'agy\bin\agy.exe'
          New-Item -ItemType Directory -Force (Split-Path $cli) | Out-Null
          curl.exe -fL --retry 3 -o $cli 'https://storage.googleapis.com/antigravity-public/antigravity-cli/1.5.18-6386224290725888/windows-x64/cli_windows_x64.exe'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $sha = (Get-FileHash $cli -Algorithm SHA512).Hash.ToLowerInvariant()
          if ($sha -ne '53605db7013dfed51e8c416d51e0c17a3b5ad0750c13da5669954ba4a281318746be0cf8cde2b256cfdb4bfbdade4badad1a0503931f8458416184549afa06b6') { throw 'Official CLI checksum mismatch' }
          $sha | Out-File "$env:RUNNER_TEMP/agy-evidence/official-cli.sha512"
          Unblock-File $cli
          $env:AGY_TEST_CLI=$cli; $env:AGY_TEST_EVIDENCE="$env:RUNNER_TEMP/agy-evidence"
          & $cli --version | Tee-Object "$env:AGY_TEST_EVIDENCE/cli-version.txt"
          go test -count=1 -timeout=3m -run '^TestAntigravityCLI$' -v ./connect
          exit $LASTEXITCODE
      - name: Windows 11 桌面 x64 App 原生接入
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Get-CimInstance Win32_OperatingSystem | Format-List Caption,Version,OSArchitecture,ProductType
          if ((Get-CimInstance Win32_OperatingSystem).ProductType -ne 1) { throw 'Windows Server is prohibited' }
          $installer = Join-Path $env:RUNNER_TEMP 'Antigravity-x64.exe'
          curl.exe -fL --retry 3 -o $installer 'https://storage.googleapis.com/antigravity-public/antigravity-hub/2.35.2-4585983447007232/windows-x64/Antigravity-x64.exe'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-FileHash $installer | Format-List | Out-File "$env:RUNNER_TEMP/agy-evidence/official-package.sha256"
          $p=Start-Process $installer -ArgumentList '/S' -PassThru
          if (-not $p.WaitForExit(240000)) { throw 'Official installer did not complete' }
          if ($p.ExitCode -ne 0) { throw "Installer exit $($p.ExitCode)" }
          $app=@("$env:LOCALAPPDATA/Programs/Antigravity/Antigravity.exe","$env:ProgramFiles/Antigravity/Antigravity.exe","${env:ProgramFiles(x86)}/Antigravity/Antigravity.exe") | Where-Object {Test-Path $_} | Select-Object -First 1
          if (-not $app) { $app=Get-ChildItem "$env:LOCALAPPDATA/Programs" -Filter Antigravity.exe -Recurse -ErrorAction SilentlyContinue | Select-Object -ExpandProperty FullName -First 1 }
          if (-not $app) {throw 'Official App not found after installation'}
          Get-Process Antigravity -ErrorAction SilentlyContinue | Stop-Process -ErrorAction SilentlyContinue
          $env:AGY_TEST_APP=$app
          $env:AGY_TEST_EVIDENCE="$env:RUNNER_TEMP/agy-evidence"
          $env:AGY_TEST_INTERACT=(Resolve-Path tools/antigravity_ui_windows.ps1).Path
          $env:AGY_TEST_CDP_SCRIPT=(Resolve-Path tools/antigravity_ui_cdp.js).Path
          go test -count=1 -timeout=8m -run '^TestAntigravityDesktop$' -v ./connect
          exit $LASTEXITCODE
      - name: 精确交付 EXE 命令与假 Key 失败保护
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $exe=(Get-ChildItem "$env:RUNNER_TEMP/candidate" -Filter '*.exe' | Select-Object -First 1).FullName
          if ((Get-Item $exe).VersionInfo.FileVersion -ne '1.2.5') {throw 'Wrong candidate version'}
          $names=@('AGY_LLM_GATEWAY_URL','AGY_LLM_GATEWAY_API_KEY','AGY_LLM_GATEWAY_WIRE_PROTOCOL','AGY_LLM_GATEWAY_MODELS')
          $before=@($names | ForEach-Object {[Environment]::GetEnvironmentVariable($_,'User')}) | ConvertTo-Json
          $inputFile=Join-Path $env:RUNNER_TEMP 'fake-key.txt'
          'sk-fake-candidate-command-20261127-753689' | Set-Content -Encoding ascii $inputFile
          $evidence="$env:RUNNER_TEMP/agy-evidence"
          $p=Start-Process -FilePath $exe -ArgumentList '--antigravity','connect' -RedirectStandardInput $inputFile -RedirectStandardOutput "$evidence/exact-command.txt" -RedirectStandardError "$evidence/exact-command-error.txt" -PassThru
          if (-not $p.WaitForExit(60000)) {Stop-Process -Id $p.Id;throw 'Candidate did not finish'}
          if ($p.ExitCode -ne 1 -or -not ([IO.File]::ReadAllText("$evidence/exact-command.txt")).Contains('HTTP 401')) {throw 'Candidate did not reject fake key'}
          $after=@($names | ForEach-Object {[Environment]::GetEnvironmentVariable($_,'User')}) | ConvertTo-Json
          if ($after -ne $before -or (Test-Path "$env:APPDATA/UseGoodAI/Antigravity/connection.json")) {throw 'Rejected key changed user configuration'}
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: Antigravity-Windows-实测记录
          path: ${{ runner.temp }}/agy-evidence
          if-no-files-found: ignore
  mac:
    runs-on: macos-15
    timeout-minutes: 30
    defaults:
      run:
        working-directory: usegoodai-codex-installer/quick-connect
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: usegoodai-codex-installer/quick-connect/go.mod
          cache: false
      - name: Apple 芯片回归及签名候选
        run: |
          test "$(uname -m)" = arm64
          go test -count=1 ./connect ./macapp
          python3 ../desktop/build.py --mac-only
          mkdir -p "$RUNNER_TEMP/candidate" "$RUNNER_TEMP/agy-evidence"
          python3 ../desktop/sign_mac.py ../dist/desktop/download/usegoodai-quick-connect-mac-arm64.zip "$RUNNER_TEMP/candidate/usegoodai-quick-connect-mac-arm64.zip"
          cp tools/antigravity-mac-readme.txt "$RUNNER_TEMP/candidate/使用说明.txt"
      - uses: actions/upload-artifact@v5
        with:
          name: Antigravity-Mac-arm64-候选
          path: ${{ runner.temp }}/candidate/
          retention-days: 30
      - name: 打开官方 Apple 芯片 App 并发送测试
        run: |
          mkdir "$RUNNER_TEMP/agy-dmg"
          curl -fL --retry 3 -o "$RUNNER_TEMP/agy.dmg" https://storage.googleapis.com/antigravity-public/antigravity-hub/2.35.2-4585983447007232/darwin-arm/Antigravity.dmg
          shasum -a 256 "$RUNNER_TEMP/agy.dmg" > "$RUNNER_TEMP/agy-evidence/official-package.sha256"
          hdiutil attach -nobrowse -readonly -mountpoint "$RUNNER_TEMP/agy-dmg" "$RUNNER_TEMP/agy.dmg"
          trap 'hdiutil detach "$RUNNER_TEMP/agy-dmg" || true' EXIT
          ditto "$RUNNER_TEMP/agy-dmg/Antigravity.app" "$RUNNER_TEMP/Antigravity.app"
          export AGY_TEST_APP="$RUNNER_TEMP/Antigravity.app"
          export AGY_TEST_EVIDENCE="$RUNNER_TEMP/agy-evidence"
          export AGY_TEST_INTERACT="$PWD/tools/antigravity_ui_mac.sh"
          export AGY_TEST_SCRIPT="$PWD/../install/antigravity.sh"
          go test -count=1 -timeout=8m -run '^TestAntigravityDesktop$' -v ./connect
      - name: 官方 Apple 芯片 CLI 1.5.18 配置与原生对话
        run: |
          mkdir "$RUNNER_TEMP/agy-cli"
          curl -fL --retry 3 -o "$RUNNER_TEMP/agy-cli/official.tar.gz" https://storage.googleapis.com/antigravity-public/antigravity-cli/1.5.18-6386224290725888/darwin-arm/cli_mac_arm64.tar.gz
          printf '%s  %s\n' d10e124f5eb4da94ebb6c494cd2e7b38744f9f66e8e87145d2cbad1cbd3c4160fd88a79cd4220dfce7c9da0ddead652346bcc839914575f6447438ae8d1d5dcc "$RUNNER_TEMP/agy-cli/official.tar.gz" | shasum -a 512 -c - | tee "$RUNNER_TEMP/agy-evidence/official-cli.sha512"
          tar -xzf "$RUNNER_TEMP/agy-cli/official.tar.gz" -C "$RUNNER_TEMP/agy-cli" antigravity
          chmod +x "$RUNNER_TEMP/agy-cli/antigravity"
          export AGY_TEST_CLI="$RUNNER_TEMP/agy-cli/antigravity" AGY_TEST_EVIDENCE="$RUNNER_TEMP/agy-evidence" AGY_TEST_SCRIPT="$PWD/../install/antigravity.sh"
          "$AGY_TEST_CLI" --version | tee "$AGY_TEST_EVIDENCE/cli-version.txt"
          go test -count=1 -timeout=3m -run '^TestAntigravityCLI$' -v ./connect
      - name: 精确签名 App 接收网页 v2 链接与假 Key 失败保护
        run: |
          mkdir "$RUNNER_TEMP/signed-candidate"
          ditto -x -k "$RUNNER_TEMP/candidate/usegoodai-quick-connect-mac-arm64.zip" "$RUNNER_TEMP/signed-candidate"
          app="$(find "$RUNNER_TEMP/signed-candidate" -maxdepth 1 -name '*.app' -print -quit)"
          codesign --verify --deep --strict "$app"
          /System/Library/Frameworks/CoreServices.framework/Frameworks/LaunchServices.framework/Support/lsregister -f "$app"
          open 'usegoodai://import?v=2&app=antigravity&key=sk-fake-candidate-entry-20261127-310e67&name=Actions'
          found=0
          for i in $(seq 1 60); do
            if ps -axww -o command= | grep -F 'display alert' | grep -Fq 'HTTP 401'; then found=1; break; fi
            sleep 1
          done
          /usr/sbin/screencapture -x "$RUNNER_TEMP/agy-evidence/signed-link.png" || true
          test "$found" = 1
          test ! -e "$HOME/Library/Application Support/UseGoodAI/Antigravity/connection.json"
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: Antigravity-Mac-实测记录
          path: ${{ runner.temp }}/agy-evidence
          if-no-files-found: ignore
      - name: 候选助手按浏览器下载方式实际打开
        if: ${{ !cancelled() }}
        run: python3 ../../tests/mac-app-open.py "$RUNNER_TEMP/candidate/usegoodai-quick-connect-mac-arm64.zip"
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: Antigravity-Mac-候选隔离标记打开记录
          path: ${{ runner.temp }}/mac-app-open/report
          if-no-files-found: ignore
